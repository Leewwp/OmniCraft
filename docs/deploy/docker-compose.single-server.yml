# Single-server Web Beta compose template.
# Usage on the server:
#   docker compose --env-file .env -f docker-compose.single-server.yml up -d --build
#
# Only nginx publishes host ports (80/443). PostgreSQL, Redis, backend,
# frontend, Prometheus, Loki and Alloy stay on the Docker network. The
# metrics/readiness endpoints on backend:9091 are internal-only; operator
# access to Loki goes through loki-gate bound to 127.0.0.1:13100 (SSH tunnel).
#
# Variables (beyond .env): OBS_GATE_TOKEN (operator token, required),
# OBS_LOG_DIR (read-only host dir of container JSON logs for Alloy), and
# PGBOUNCER_IMAGE (a registry-verified image reference ending in @sha256:<64
# hex characters; no mutable tag/default is accepted).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: pgvector/pgvector@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-omnicraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-omnicraft}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-omnicraft} -d ${POSTGRES_DB:-omnicraft}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1g

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    environment:
      # Migrations use the same unexposed PgBouncer exception as backend;
      # production preflight rejects direct PostgreSQL sslmode=disable.
      DB_DSN: "host=pgbouncer port=5432 user=${POSTGRES_USER:-omnicraft} password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD} dbname=${POSTGRES_DB:-omnicraft} sslmode=disable"
      METRICS_TEXTFILE_DIR: /var/lib/omnicraft/metrics
    depends_on:
      pgbouncer:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/evidence
      - ${METRICS_TEXTFILE_DIR:?set METRICS_TEXTFILE_DIR}:/var/lib/omnicraft/metrics
    command: ["./migrate", "-Dir", "/app/migrations", "-SummaryPath", "/app/evidence/migration-summary.json"]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m

  redis:
    image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 512m

  pgbouncer:
    image: ${PGBOUNCER_IMAGE:?set PGBOUNCER_IMAGE to an immutable @sha256 image reference}
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-omnicraft}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      AUTH_TYPE: "scram-sha-256"
      DB_NAME: ${POSTGRES_DB:-omnicraft}
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 100
      DEFAULT_POOL_SIZE: 20
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-omnicraft} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DB_DSN: "host=pgbouncer port=5432 user=${POSTGRES_USER:-omnicraft} password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD} dbname=${POSTGRES_DB:-omnicraft} sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      REDIS_DB: ${REDIS_DB:-0}
      # pgbouncer is an unexposed internal host: preflight allows TLS
      # negotiation (sslmode=disable) only for hosts in this explicit list.
      OMNICRAFT_PRIVATE_DB_HOSTS: "pgbouncer"
      CONFIG_OVERRIDE_PATH: /app/config_override.yaml
    volumes:
      - /var/lib/omnicraft/config_override.yaml:/app/config_override.yaml:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.leeppp.online}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://app.leeppp.online}
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.leeppp.online}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://app.leeppp.online}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768m

  nginx:
    image: nginx@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/omnicraft.single-server.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1 and
      # the conf listens on IPv4 only, which fails the probe.
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m

  prometheus:
    image: prom/prometheus@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=10GB
    volumes:
      - prometheus_data:/prometheus
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/prometheus-rules.yml:/etc/prometheus/prometheus-rules.yml:ro
    depends_on:
      backend:
        condition: service_healthy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m

  alertmanager:
    image: prom/alertmanager@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - alertmanager_data:/alertmanager
      # ALERTMANAGER_CONFIG_FILE must point at the operator-rendered config
      # (receiver values never come from Git; see single-server-beta-runbook.md).
      - ${ALERTMANAGER_CONFIG_FILE:?set ALERTMANAGER_CONFIG_FILE}:/etc/alertmanager/alertmanager.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter@sha256:386b12d19eab2a37d7cd8ca8b4c7491cc7a830d9581f49af6c98a393da9605e6
    restart: unless-stopped
    environment:
      # Keep exporter traffic on the explicit internal PgBouncer exception.
      DATA_SOURCE_URI: "pgbouncer:5432/${POSTGRES_DB:-omnicraft}?sslmode=disable"
      DATA_SOURCE_USER: ${POSTGRES_USER:-omnicraft}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    depends_on:
      pgbouncer:
        condition: service_healthy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m

  redis-exporter:
    image: oliver006/redis_exporter@sha256:c5a968ba5f30bab5e12181cceb89c4ed37cb4fe4d85490b5b66c7cfe4750b5e8
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m

  cadvisor:
    image: gcr.io/cadvisor/cadvisor@sha256:3cde6faf0791ebf7b41d6f8ae7145466fed712ea6f252c935294d2608b1af388
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --housekeeping_interval=15s
      - --docker_only=true
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m

  blackbox:
    image: prom/blackbox-exporter@sha256:3af31f8bd1ad2907b4b0f7c485fde3de0a8ee0b498d42fc971f0698885c03acb
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./ops/observability/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m

  node-exporter:
    image: prom/node-exporter@sha256:4032c6d5bfd752342c3e631c2f1de93ba6b86c41db6b167b9a35372c139e7706
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
    volumes:
      - /:/host:ro,rslave
      - ${METRICS_TEXTFILE_DIR:?set METRICS_TEXTFILE_DIR}:/var/lib/node_exporter/textfile_collector:ro
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m

  loki:
    image: grafana/loki@sha256:58a6c186ce78ba04d58bfe2a927eff296ba733a430df09645d56cdc158f3ba08
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        max_kb=$$(( $${LOKI_MAX_DISK_BYTES} / 1024 ));
        /usr/bin/loki -config.file=/etc/loki/loki.yml -config.expand-env=false &
        main_pid=$$!;
        (
          while kill -0 "$$main_pid" 2>/dev/null; do
            used_kb=$$(du -sk /loki | awk '{print $$1}');
            if [ "$$used_kb" -gt "$$max_kb" ]; then
              echo "loki disk cap exceeded: $${used_kb}KB > $${max_kb}KB" >&2;
              kill "$$main_pid";
              exit 1;
            fi;
            sleep 30;
          done
        ) &
        watcher_pid=$$!;
        wait "$$main_pid";
        status=$$?;
        kill "$$watcher_pid" 2>/dev/null || true;
        wait "$$watcher_pid" 2>/dev/null || true;
        exit "$$status"
    environment:
      LOKI_MAX_DISK_BYTES: ${LOKI_MAX_DISK_BYTES:-53687091200}
    volumes:
      - loki_data:/loki
      - ./ops/observability/loki.yml:/etc/loki/loki.yml:ro
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512m

  alloy:
    image: grafana/alloy@sha256:8fad63014ac2d69dd5e21e51ec1639bb6f52b43402ff8ca96125ea874b7f6422
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/alloy-config.alloy
    volumes:
      - alloy_data:/var/lib/alloy/data
      - ./ops/observability/alloy-config.alloy:/etc/alloy/alloy-config.alloy:ro
      - ${OBS_LOG_DIR:?set OBS_LOG_DIR (read-only host log dir)}:/var/log/containers:ro
    depends_on:
      - loki
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256m

  loki-gate:
    build:
      context: ./ops/observability/gate
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      GATE_TOKEN: ${OBS_GATE_TOKEN:?set OBS_GATE_TOKEN}
      LOKI_UPSTREAM: "http://loki:3100"
      AUDIT_DIR: /var/log/gate
    ports:
      - "127.0.0.1:13100:8080"
    volumes:
      - loki_gate_audit:/var/log/gate
    depends_on:
      - loki
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  loki_data:
  alloy_data:
  loki_gate_audit:
  alertmanager_data:
