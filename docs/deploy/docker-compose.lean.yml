# Lean profile for low-resource hosts (3.6 GiB usable memory) for the single-server
# deployment. Applied as a Compose override on top of the committed base file:
#
#   docker compose --env-file .env \
#     -f docker-compose.single-server.yml \
#     -f docker-compose.lean.yml up -d --build
#
# What this override changes (runbook §6.2 resource-constrained profile):
#   - defers the ten resident observability/alerting services behind the
#     "full-observability" profile; start them only on >= 8 GiB hosts or when
#     observability is hosted separately;
#   - tightens the standalone worker's memory cap (the worker itself is
#     defined in the base file since #988: the API server never starts async
#     consumers, so without the worker the outbox relay and the review/
#     notification queue topics are never consumed);
#   - caps aggregate resident memory limits at <= 2.6 GiB. Caps are sized
#     from measured idle RSS on the lean host (2026-08-31: redis 6 MiB,
#     backend 7 MiB, postgres 39 MiB, pgbouncer 5 MiB, nginx 17 MiB,
#     frontend 90 MiB) with headroom for light traffic;
#   - points Prometheus at the backend-only lean config (plus the
#     backend-metrics agent-SLA rule subset). The committed
#     ops/observability/prometheus.yml also targets exporters/cadvisor/
#     blackbox/node-exporter, which are deferred on this host; loading it
#     unchanged would present permanent blind targets.
#
# Deferred services can still be inspected without starting them:
#   docker compose --profile full-observability ... config

services:
  postgres:
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    deploy:
      resources:
        limits:
          memory: 256m

  pgbouncer:
    deploy:
      resources:
        limits:
          memory: 128m

  backend:
    deploy:
      resources:
        limits:
          memory: 512m

  frontend:
    build:
      args:
        # Empty by default (registry.npmjs.org); set NPM_REGISTRY in .env on
        # hosts where the default registry is slow or unreachable.
        NPM_REGISTRY: ${NPM_REGISTRY:-}
    deploy:
      resources:
        limits:
          memory: 512m

  nginx:
    deploy:
      resources:
        limits:
          memory: 64m

  prometheus:
    volumes:
      # Same target path as the base mount: this replaces the full config
      # (backend-only job list, agent-SLA rule subset only, no alertmanager).
      - ./ops/observability/prometheus.lean.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/prometheus-rules.lean.yml:/etc/prometheus/prometheus-rules.lean.yml:ro
    deploy:
      resources:
        limits:
          memory: 256m

  worker:
    # Full worker definition lives in the base file (#988); the lean profile
    # only tightens the memory cap for the 3.6 GiB host.
    deploy:
      resources:
        limits:
          memory: 256m

  # ---------------------------------------------------------------------
  # Deferred on the 3.6 GiB lean host (runbook §6.2). The profile
  # marker excludes them from a plain `up`; pass
  # --profile full-observability to opt back in on a larger host.
  # ---------------------------------------------------------------------
  alertmanager:
    profiles: ["full-observability"]

  postgres-exporter:
    profiles: ["full-observability"]

  redis-exporter:
    profiles: ["full-observability"]

  cadvisor:
    profiles: ["full-observability"]

  blackbox:
    profiles: ["full-observability"]

  node-exporter:
    profiles: ["full-observability"]

  loki:
    profiles: ["full-observability"]

  alloy:
    profiles: ["full-observability"]

  loki-gate:
    profiles: ["full-observability"]
