# OmniCraft gitleaks allowlist.
# Extends the default rules with path-scoped exemptions for historical
# test fixtures and documentation examples that match generic secret
# patterns but contain no real credentials. Every entry is a reviewed
# exemption equivalent to a security-policy decision: do not add new
# paths here without review (see security/scan-policy.json).
title = "OmniCraft gitleaks allowlist"

[extend]
useDefault = true

[allowlist]
# Each path below is allowlisted because matches occur only in test
# fixtures, documentation examples or template constants. The current
# working tree is verified clean by scripts/security/verify-security.sh.
paths = [
  # backend config tests use fake hex secrets as test values
  "backend/config/config_test.go",
  # archived plan document uses a fake secret placeholder in an example;
  # allowlisted under both the historical path (commits before the archive
  # rename on 2026-08-07) and the current archived location
  "docs/superpowers/plans/2026-06-08-omnicraft-release-gates-config-hardening.md",
  "docs/archive/plans/2026-06-08-omnicraft-release-gates-config-hardening.md",
  # web-video-presentation template constant that resembles a token
  ".agents/skills/web-video-presentation/templates/src/hooks/useStepper.ts",
  # dev-only seed script historically contained a demo JWT (removed from the current tree)
  "scripts/seed-test-data.sh",
  # release-gate test fixtures use deliberately fake credentials
  # ("correct-horse-battery-staple", "*-strong-secret", "real-*-secret")
  # to exercise preflight/drill substitution and rejection paths
  "scripts/release/deployment-contract.tests.sh",
  "scripts/release/preflight.tests.sh",
  "scripts/release/staging-drill.tests.sh",
]
# The RAG eval baseline is a single-line JSON of fabricated local-eval data
# (#136); its dataset case name "mix_cyberpunk_2077" trips the generic-api-key
# entropy heuristic without being a credential. Exempting the exact literal
# instead of the path keeps every other string in that file scanned.
regexes = [
  '''\bmix_cyberpunk_2077\b''',
]
