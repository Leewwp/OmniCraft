# Docker JSON-file rotation for every service (policy:
# ops/observability/log-retention-policy.json). Container logs stream to
# stdout, Docker rotates them, and Grafana Alloy ships the files to Loki.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: omnicraft-postgres
    environment:
      POSTGRES_USER: omnicraft
      POSTGRES_PASSWORD: omnicraft
      POSTGRES_DB: omnicraft
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omnicraft"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnicraft-migrate
    environment:
      DB_DSN: "host=postgres port=5432 user=omnicraft password=omnicraft dbname=omnicraft sslmode=disable"
      METRICS_TEXTFILE_DIR: /var/lib/omnicraft/metrics
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./artifacts:/app/evidence
      - ${METRICS_TEXTFILE_DIR:-./artifacts/metrics}:/var/lib/omnicraft/metrics
    command: ["./migrate", "-Dir", "/app/migrations", "-SummaryPath", "/app/evidence/migration-summary.json"]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  pgbouncer:
    build:
      context: ./pgbouncer
      dockerfile: Dockerfile
    container_name: omnicraft-pgbouncer
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    command: ["pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U omnicraft || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  redis:
    image: redis:7-alpine
    container_name: omnicraft-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnicraft-backend
    env_file: .env
    environment:
      DB_DSN: "host=pgbouncer port=5432 user=omnicraft password=omnicraft dbname=omnicraft sslmode=disable"
      REDIS_ADDR: "redis:6379"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Embedded into the browser bundle; backend is only resolvable
        # inside the Compose network.
        NEXT_PUBLIC_API_URL: "http://localhost:8080"
    container_name: omnicraft-frontend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080"
      INTERNAL_API_URL: "http://backend:8080"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnicraft-worker
    env_file: .env
    environment:
      DB_DSN: "host=pgbouncer port=5432 user=omnicraft password=omnicraft dbname=omnicraft sslmode=disable"
      REDIS_ADDR: "redis:6379"
    depends_on:
      migrate:
        condition: service_completed_successfully
      pgbouncer:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["./worker"]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  nginx:
    image: nginx:alpine
    container_name: omnicraft-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ssl_certs:/etc/letsencrypt:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

  # ---------------------------------------------------------------------
  # Alerting: Alertmanager routes Prometheus alerts to operators. Receiver
  # values stay outside Git (placeholders are substituted at drill/deploy
  # time). Exporters feed the alert rules in
  # ops/observability/prometheus-rules.yml. All of these bind no public
  # ports; Prometheus reaches them by service name on the internal network.
  # ---------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: omnicraft-alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - alertmanager_data:/alertmanager
      - ${ALERTMANAGER_CONFIG_FILE:-./ops/observability/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9093/-/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: omnicraft-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://omnicraft:omnicraft@postgres:5432/omnicraft?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  redis-exporter:
    image: oliver006/redis_exporter:v1.62.0
    container_name: omnicraft-redis-exporter
    environment:
      REDIS_ADDR: "redis://redis:6379"
    depends_on:
      redis:
        condition: service_healthy
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: omnicraft-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --housekeeping_interval=15s
      - --docker_only=true
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  blackbox:
    image: prom/blackbox-exporter:v0.24.0
    container_name: omnicraft-blackbox
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./ops/observability/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

volumes:
  postgres_data:
  redis_data:
  ssl_certs:
  alertmanager_data:
