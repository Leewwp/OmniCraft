[databases]
# Upstream credentials are explicit here: clients authenticate with
# auth_type=trust (their DSN password is not verified and, under SCRAM
# client auth, never revealed in plaintext, so credential passthrough is
# NOT possible). On a deployed host this password must match the .env
# POSTGRES_PASSWORD — regenerate it from .env on every deploy/rotation
# (deploy runbook §single-server: sed the upstream password after
# git-archive extracts the repo placeholder).
omnicraft = host=postgres port=5432 dbname=omnicraft user=omnicraft password=omnicraft

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
auth_type = trust
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = session
max_client_conn = 200
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
server_idle_timeout = 600
log_connections = 0
log_disconnections = 0
