name: OmniCraft CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      failure_probe:
        description: "Intentionally fail the project gate for evidence drills"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_USER: omnicraft
          POSTGRES_PASSWORD: omnicraft
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U omnicraft" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.12"
      - name: Cache Go build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}
      - name: Backend verification
        run: bash scripts/verify-project.sh -Scope Backend -ReportDir artifacts/backend
      - name: Migration integration and recovery contracts
        env:
          OMNICRAFT_TEST_POSTGRES_ADMIN_DSN: host=localhost port=5432 user=omnicraft password=omnicraft dbname=postgres sslmode=disable
        run: bash scripts/db/verify-migration-gate.sh -ReportDir artifacts/backend/migrations
      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: backend-evidence
          path: artifacts/backend
          retention-days: ${{ github.event_name == 'push' && 90 || 30 }}

  frontend:
    name: Frontend gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Frontend verification
        run: bash scripts/verify-project.sh -Scope Frontend -ReportDir artifacts/frontend
      - name: Upload frontend evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: frontend-evidence
          path: artifacts/frontend
          retention-days: ${{ github.event_name == 'push' && 90 || 30 }}

  docs:
    name: Docs gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.12"
      - name: Cache Go build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}
      - name: Docs verification
        run: bash scripts/verify-project.sh -Scope Docs -ReportDir artifacts/docs
      - name: Upload docs evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: docs-evidence
          path: artifacts/docs
          retention-days: ${{ github.event_name == 'push' && 90 || 30 }}

  ops-alerting:
    name: Ops alerting gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.12"
      - name: Alerting contract tests
        run: bash scripts/ops/verify-alerts.tests.sh && bash scripts/ops/alert-drill.tests.sh
      - name: Alerting config direct check (diagnostic)
        run: |
          ruby --version || echo "NO RUBY: $?"
          bash scripts/ops/verify-alerts.sh -ConfigDir ops/observability; echo "verify rc=$?"
      - name: Alert sink tests
        run: go test ./...
        working-directory: ops/observability/alert-sink
      - name: Upload alerting evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ops-alerting-evidence
          path: artifacts
          retention-days: ${{ github.event_name == 'push' && 90 || 30 }}

  project-gate:
    needs: [backend, frontend, docs, ops-alerting]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector@sha256:a36250871de0833b8757561c72f2477ef1ddd1101afa4e617fb552e0de514c6b
        env:
          POSTGRES_USER: omnicraft
          POSTGRES_PASSWORD: omnicraft
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U omnicraft" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Verify dependency results
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          DOCS_RESULT: ${{ needs.docs.result }}
          OPS_ALERTING_RESULT: ${{ needs.ops-alerting.result }}
        run: test "$BACKEND_RESULT" = success && test "$FRONTEND_RESULT" = success && test "$DOCS_RESULT" = success && test "$OPS_ALERTING_RESULT" = success
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.12"
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Cache Go build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}
      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Project verification
        run: bash scripts/verify-project.sh -ReportDir artifacts/gate
      - name: Failure probe
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.failure_probe == true }}
        run: exit 1
      - name: Upload gate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: project-gate-evidence
          path: artifacts/gate
          retention-days: ${{ github.event_name == 'push' && 90 || 30 }}
