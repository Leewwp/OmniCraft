name: OmniCraft Security

on:
  # Audit F-05 finding 3: the security gates used to run weekly only, so PRs
  # and main pushes had no security scan at all while scan-policy.json
  # declared pull_request/push_main triggers. PRs run every gate except the
  # container-image builds (slow; scheduled and main-push runs keep them).
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly Monday 06:00 UTC; daily runs repeated identical trivy scans for unchanged code
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-gate:
    name: Security gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.13"
      - name: Cache Go build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/go-build
          key: go-${{ runner.os }}-${{ hashFiles('backend/go.sum') }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}
      - name: Verify pinned actions
        run: bash scripts/security/verify-pinned-actions.sh
      - name: Security contract tests
        run: bash scripts/security/verify-pinned-actions.tests.sh && bash scripts/security/verify-security.tests.sh
      - name: Security verification
        run: |
          EXTRA_ARGS=""
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            EXTRA_ARGS="-BuildImages"
          fi
          bash scripts/security/verify-security.sh $EXTRA_ARGS -ReportDir artifacts/security
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: security-evidence
          path: artifacts/security
          retention-days: 30
