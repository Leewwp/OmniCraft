name: OmniCraft Tauri CI

on:
  workflow_dispatch:

concurrency:
  group: tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect desktop paths
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Detect changed desktop paths
        id: detect
        run: if git diff --name-only 'HEAD~1' "$GITHUB_SHA" 2>/dev/null | grep -Eq '^tauri-client/'; then changed=true; else changed=false; fi; echo "desktop paths changed=$changed"; echo "changed=$changed" >> "$GITHUB_OUTPUT"
  tauri-windows:
    name: Desktop Windows gates
    # The Windows runner is billed at 2x the Linux rate, so it must not be
    # started for main pushes that do not touch tauri-client/. GitHub treats a
    # job skipped by this condition as passing.
    if: needs.detect.outputs.changed == 'true'
    needs: detect
    runs-on: windows-latest
    env:
      AGENT_HMAC_SECRET: ci-pr-dummy-build-secret-not-for-signing
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('tauri-client/package-lock.json') }}
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo
          key: cargo-${{ runner.os }}-${{ hashFiles('tauri-client/src-tauri/Cargo.lock') }}
      - name: Install client dependencies
        run: npm ci
        working-directory: tauri-client
      - name: Desktop verification
        run: bash scripts/verify-project.sh -Scope Tauri -ReportDir artifacts/tauri
      - name: Upload desktop evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: tauri-evidence
          path: artifacts/tauri
          retention-days: 30
