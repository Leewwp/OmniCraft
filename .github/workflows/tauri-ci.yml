name: OmniCraft Tauri CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tauri-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    name: Detect desktop paths
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Detect changed desktop paths
        id: detect
        # Fail closed: if the diff itself cannot be computed, exit non-zero
        # instead of treating the change set as empty.
        run: |
          changed=false
          diff_output="$(git diff --name-only 'HEAD~1' "$GITHUB_SHA")" || {
            echo "detect: git diff failed" >&2
            exit 1
          }
          if printf '%s\n' "$diff_output" | grep -Eq '^(tauri-client/|\.github/workflows/tauri-ci\.yml$|scripts/verify-project\.sh$)'; then
            changed=true
          fi
          echo "desktop paths changed=$changed"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
  tauri-windows:
    name: Desktop Windows gates
    # The Windows runner is billed at 2x the Linux rate, so it runs only when
    # desktop-relevant paths changed: tauri-client/, this workflow itself, or
    # scripts/verify-project.sh (the verification script the Windows job
    # executes). GitHub treats a job skipped by this condition as passing.
    if: needs.detect.outputs.changed == 'true'
    needs: detect
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Cache npm
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('tauri-client/package-lock.json') }}
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cargo
          key: cargo-${{ runner.os }}-${{ hashFiles('tauri-client/src-tauri/Cargo.lock') }}
      - name: Install client dependencies
        run: npm ci
        working-directory: tauri-client
      - name: Desktop verification
        run: bash scripts/verify-project.sh -Scope Tauri -ReportDir artifacts/tauri
      - name: Upload desktop evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tauri-evidence
          path: artifacts/tauri
          retention-days: 30
