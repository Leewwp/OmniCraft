# OmniCraft archive scanning profile. This file is only mounted by the
# full-infra/security Compose profiles; clamd remains on the private network.
Foreground yes
TCPSocket 3310
TCPAddr 0.0.0.0
MaxFileSize 600M
StreamMaxLength 600M
MaxScanSize 2G
MaxFiles 10000
MaxRecursion 10
AlertExceedsMax yes
AlertEncryptedArchive yes
DetectPUA no
