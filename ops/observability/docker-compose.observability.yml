# OmniCraft observability stack: Prometheus (metrics), Loki (logs),
# Grafana Alloy (read-only log shipping) and loki-gate (authenticated,
# audited operator access to Loki).
#
# This file is designed to be OVERLAYED on the main docker-compose.yml
# (docker compose -f docker-compose.yml -f ops/observability/docker-compose.observability.yml)
# so all services share the project network and Prometheus can scrape
# "backend:9091" by service name.
#
# Operator access: only loki-gate publishes a host port, bound to 127.0.0.1.
# Prometheus/Loki/Alloy expose no public port. In production, reach the gate
# through an SSH tunnel and set GATE_TOKEN to the operator secret.
#
# Variables (set by the drill or deployment):
#   OBS_GATE_TOKEN   operator token for loki-gate (required)
#   OBS_CONFIG_DIR   directory holding prometheus.yml/loki.yml/alloy-config.alloy
#   OBS_LOG_DIR      read-only directory of container JSON log files tailed by Alloy

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: omnicraft-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=10GB
    volumes:
      - prometheus_data:/prometheus
      - ${OBS_CONFIG_DIR:-.}/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command:
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
    volumes:
      - ${METRICS_TEXTFILE_DIR:?METRICS_TEXTFILE_DIR is required}:/var/lib/node_exporter/textfile_collector:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  loki:
    image: grafana/loki:3.4.2
    container_name: omnicraft-loki
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        max_kb=$$(( $${LOKI_MAX_DISK_BYTES} / 1024 ));
        /usr/bin/loki -config.file=/etc/loki/loki.yml -config.expand-env=false &
        main_pid=$$!;
        (
          while kill -0 "$$main_pid" 2>/dev/null; do
            used_kb=$$(du -sk /loki | awk '{print $$1}');
            if [ "$$used_kb" -gt "$$max_kb" ]; then
              echo "loki disk cap exceeded: $${used_kb}KB > $${max_kb}KB" >&2;
              kill "$$main_pid";
              exit 1;
            fi;
            sleep 30;
          done
        ) &
        watcher_pid=$$!;
        wait "$$main_pid";
        status=$$?;
        kill "$$watcher_pid" 2>/dev/null || true;
        wait "$$watcher_pid" 2>/dev/null || true;
        exit "$$status"
    environment:
      LOKI_MAX_DISK_BYTES: ${LOKI_MAX_DISK_BYTES:-53687091200}
    volumes:
      - loki_data:/loki
      - ${OBS_CONFIG_DIR:-.}/loki.yml:/etc/loki/loki.yml:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  alloy:
    image: grafana/alloy:v1.8.2
    container_name: omnicraft-alloy
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/alloy-config.alloy
    volumes:
      - alloy_data:/var/lib/alloy/data
      - ${OBS_CONFIG_DIR:-.}/alloy-config.alloy:/etc/alloy/alloy-config.alloy:ro
      - ${OBS_LOG_DIR:?OBS_LOG_DIR is required}:/var/log/containers:ro
    depends_on:
      - loki
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  loki-gate:
    build:
      context: ${OBS_CONFIG_DIR:?OBS_CONFIG_DIR is required}/gate
      dockerfile: Dockerfile
    container_name: omnicraft-loki-gate
    environment:
      GATE_TOKEN: ${OBS_GATE_TOKEN:?OBS_GATE_TOKEN is required}
      LOKI_UPSTREAM: "http://loki:3100"
      AUDIT_DIR: /var/log/gate
    ports:
      - "127.0.0.1:${OBS_GATE_PORT:-13100}:8080"
    volumes:
      - loki_gate_audit:/var/log/gate
    depends_on:
      - loki
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  prometheus_data:
  loki_data:
  alloy_data:
  loki_gate_audit:
