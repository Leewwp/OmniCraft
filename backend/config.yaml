server:
  port: "8080"
  mode: "debug"

database:
  dsn: "host=localhost port=5432 user=omnicraft password=omnicraft dbname=omnicraft sslmode=disable"
  read_dsn: ""

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

jwt:
  secret: "dev-secret-change-in-production"
  access_token_ttl: 120
  refresh_token_ttl: 7

oss:
  endpoint: ""
  access_key_id: ""
  access_key_secret: ""
  bucket_name: ""
  domain: ""

green:
  access_key_id: ""
  access_key_secret: ""
  region: "cn-shanghai"
  callback_url: ""
  callback_allowed_ips:
    - "127.0.0.1"
    - "::1"

features:
  payment_enabled: false

limits:
  video_max_mb: 300
  video_max_sec: 180
  image_max_mb: 20
  text_max_mb: 10
  mod_max_mb: 500
  sheet_music_max_mb: 50

reputation:
  quality_content_threshold: 10
  quality_comment_threshold: 5
  repeat_violation_window_days: 7
  repeat_violation_threshold: 2
  repeat_violation_extra_penalty: -1

judge:
  min_votes_required: 20
  pass_threshold: 0.60
  exam_pass_rate: 0.80
  error_rate_revoke: 0.50
  error_rate_window: 10

social:
  report_auto_hide_rate: 0.10
  comment_fold_threshold: 0.30

upload:
  sheet_music_extensions:
    - ".mid"
    - ".midi"
    - ".xml"
    - ".mxl"
    - ".mscz"
    - ".mscx"
    - ".pdf"
    
agent:
  web_agent_enabled: true
  llm_provider: "openai_compat"        # 或 "qwen"
  llm_model: "deepseek-chat"           # 按实际选择
  llm_api_base: "https://api.deepseek.com"
  llm_api_key: ""                      # 留空，改用 env var 注入（需修复 config.go）
  embedding_model: "text-embedding-3-small"
  embedding_dimensions: 1536
  rate_limit_per_day: 50
  upload_assist_max_file_mb: 10