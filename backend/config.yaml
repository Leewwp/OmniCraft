server:
  port: "8080"
  mode: "debug"

security:
  allowed_origins:
    - "http://localhost:3000"

database:
  dsn: "host=localhost port=5432 user=omnicraft password=omnicraft dbname=omnicraft sslmode=disable"
  read_dsn: ""

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

jwt:
  secret: "dev-secret-change-in-production"
  access_token_ttl: 120
  refresh_token_ttl: 7

oss:
  endpoint: ""
  access_key_id: ""
  access_key_secret: ""
  bucket_name: ""
  domain: ""

green:
  access_key_id: ""
  access_key_secret: ""
  region: "cn-shanghai"
  callback_url: ""
  callback_allowed_ips:
    - "127.0.0.1"
    - "::1"

features:
  payment_enabled: false
  desktop_deploy_enabled: false

captcha:
  provider: "bypass"
  prefix: ""
  scene_id: ""
  region: "cn"
  access_key_id: ""
  access_key_secret: ""

client:
  download_enabled: false
  download_url: ""
  latest_version: ""

limits:
  video_max_mb: 300
  video_max_sec: 180
  image_max_mb: 20
  text_max_mb: 10
  mod_max_mb: 500
  sheet_music_max_mb: 50

reputation:
  min_score_for_interaction: 3
  quality_content_threshold: 10
  quality_comment_threshold: 5
  repeat_violation_window_days: 7
  repeat_violation_threshold: 2
  repeat_violation_extra_penalty: -1

judge:
  min_votes_required: 20
  pass_threshold: 0.60
  exam_pass_rate: 0.80
  error_rate_revoke: 0.50
  error_rate_window: 10

social:
  report_auto_hide_rate: 0.10
  comment_fold_threshold: 0.30

recommendation:
  enabled: true
  hot_decay_hours: 48
  personalization_weight: 0.6
  min_interaction_for_personalize: 10
  embedding_topk: 200
  trending_window_days: 7
  refresh_interval_h: 2

publish:
  type_order_original: ["image", "article", "video", "audio", "template", "sheet_music", "other"]
  type_order_fanwork: ["image", "article", "video", "audio", "mod", "prompt", "sheet_music", "other"]

upload:
  sheet_music_extensions:
    - ".mid"
    - ".midi"
    - ".xml"
    - ".mxl"
    - ".mscz"
    - ".mscx"
    - ".pdf"
    
agent:
  web_agent_enabled: true
  llm_provider: "openai_compat"        # 或 "qwen"
  llm_model: "deepseek-chat"           # 按实际选择
  llm_api_base: "https://api.deepseek.com"
  llm_api_key: ""                      # 留空，改用 env var 注入（需修复 config.go）
  embedding_model: "text-embedding-3-small"
  embedding_dimensions: 1536
  rate_limit_per_day: 50
  upload_assist_max_file_mb: 10

rate_limit:
  enabled: true
  normal_per_minute: 100
  upload_per_hour: 200

cache:
  content_list_ttl: 300
  content_detail_ttl: 300
  ip_list_ttl: 300
  ip_detail_ttl: 300
  view_count_flush_interval: 60
  user_status_ttl: 300
  publish_freeze_ttl: 604800

queue:
  enabled: false
  max_attempts: 3
  retry_backoff_sec:
    - 10
    - 60
    - 300
  dlq_ttl_hours: 168
  maxlen: 100000
  worker_review: 2
  worker_notification: 1
  worker_embedding: 1
  worker_count: 1
