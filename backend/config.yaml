server:
  port: "8080"
  mode: "debug"
  shutdown_timeout: 15
  read_timeout: 30
  write_timeout: 60
  idle_timeout: 120

observability:
  metrics_port: "9091"
  log_level: "info"
  log_ip_hash_secret: ""
  log_ip_key_id: "dev-key"
  read_header_timeout_sec: 5
  ip_key_rotation:
    previous_secret: ""
    previous_key_id: ""
    active_from: ""
    active_until: ""
  readiness:
    db_timeout_sec: 3
    redis_timeout_sec: 3
  tracing:
    enabled: false
    endpoint: "otel-collector:4317"
    sample_ratio: 1.0
    backend: "jaeger"
    service_name: "omnicraft-server"

web:
  public_base_url: "http://localhost:3000"

security:
  allowed_origins:
    - "http://localhost:3000"
  trusted_proxies:
    - "127.0.0.1"

database:
  # Development default. In release mode ValidateRelease requires
  # sslmode=verify-full unless the host is listed in OMNICRAFT_PRIVATE_DB_HOSTS
  # (unexposed internal PgBouncer only).
  dsn: "host=localhost port=5432 user=omnicraft password=omnicraft dbname=omnicraft sslmode=disable"
  read_dsn: ""

redis:
  addr: "localhost:6379"
  password: ""
  db: 0

jwt:
  secret: "dev-secret-change-in-production"
  access_token_ttl: 120
  refresh_token_ttl: 7

oss:
  endpoint: ""
  access_key_id: ""
  access_key_secret: ""
  bucket_name: ""
  domain: ""
  download_url_ttl_sec: 300
  display_url_ttl_sec: 3600

green:
  access_key_id: ""
  access_key_secret: ""
  region: "cn-shanghai"
  callback_url: ""
  seed: ""
  uid: ""

features:
  payment_enabled: false
  creator_support_enabled: false
  desktop_deploy_enabled: false
  # Off by default (archive malware scanning design §6); enabling it in
  # release mode additionally requires the full archive_scan.* block below.
  archive_malware_scan_enabled: false
  # RAG remains opt-in until the full T04-T07 slice is complete.
  rag_hybrid_enabled: false
  # A-03 retrieval upgrades: both default off until the A-04 ablation
  # decides their default values with real data.
  rag_query_expansion_enabled: false
  rag_rerank_enabled: false

rag:
  chunking:
    max_tokens: 512
    overlap_tokens: 48
    version: 1
    tokenizer_encoding: "cl100k_base"
  # A-03 rerank chain (gated by features.rag_rerank_enabled): RRF top-N →
  # primary (DashScope qwen3-rerank) → fallback (SiliconFlow) → RRF order
  # with a degraded marker. Keys and endpoint overrides come from env
  # (RAG_RERANK_API_KEY / RAG_RERANK_FALLBACK_API_KEY / RAG_RERANK_API_BASE /
  # RAG_RERANK_FALLBACK_API_BASE), never from this file; the primary key
  # falls back to the shared DASHSCOPE_API_KEY from the root .env.
  rerank:
    provider: "dashscope"
    model: "qwen3-rerank"
    api_base: ""
    fallback_provider: "siliconflow"
    fallback_model: "bge-reranker-v2-m3"
    fallback_api_base: ""
    input_topk: 20
    timeout_sec: 30
  index:
    # Host-local default; Compose overrides this with the service DNS name.
    # OpenSearch is the optional lexical fallback (full-infra); the canonical
    # lexical primary is rag.hybrid.keyword_source = postgres.
    url: "http://127.0.0.1:9200"
    generation_start: 1
    # Must stay in sync with agent.embedding_model when hybrid RAG is enabled
    # (config validation enforces the equality).
    embedding_model: "text-embedding-v4"
    health_poll_interval_sec: 1
    timeout_sec: 10
    audit_timeout_sec: 2
    lock_cleanup_timeout_sec: 2
    error_body_max_bytes: 65536
    response_body_max_bytes: 1048576
  hybrid:
    bm25_topk: 200
    vector_topk: 200
    rrf_k: 60
    final_topk: 10
    # Lexical primary: postgres (pg_jieba, viewer-scoped) is canonical;
    # opensearch inverts primary/fallback for full-infra stacks.
    keyword_source: "postgres"

# Archive malware scanning quotas, timeout and retry policy (design §4/§6).
# Server-side skeleton only (S01); the scan worker and gates consume it.
archive_scan:
  max_upload_size_mb: 500
  max_zip_entries: 5000
  max_entry_uncompressed_mb: 200
  max_total_uncompressed_mb: 2048
  max_recursion_depth: 10
  scan_timeout_sec: 120
  # Private Compose DNS address; the security profile overrides this with
  # clamav:3310. clamd is never exposed through a host port.
  clamd_address: "127.0.0.1:3310"
  retry_backoff_sec: [60, 300, 1800]
  url_ttl_sec: 300

captcha:
  provider: "bypass"
  prefix: ""
  scene_id: ""
  region: "cn"
  access_key_id: ""
  access_key_secret: ""
  ticket_ttl_sec: 300

client:
  download_enabled: false
  download_url: ""
  latest_version: ""

feedback:
  upload_grant_ttl_sec: 300

smtp:
  mode: "logger"
  host: ""
  port: 587
  user: ""
  password: ""
  from_address: ""

verification:
  email_ttl_sec: 3600
  reset_ttl_sec: 3600
  resend_cooldown_sec: 60
  login_captcha_threshold: 3
  password_min_length: 8
  register_pending_ttl_sec: 86400

legal:
  current_terms_version: ""
  current_privacy_version: ""

limits:
  video_max_mb: 300
  video_max_sec: 180
  image_max_mb: 20
  text_max_mb: 10
  mod_max_mb: 500
  sheet_music_max_mb: 50

reputation:
  min_score_for_interaction: 3
  quality_content_threshold: 10
  quality_comment_threshold: 5
  repeat_violation_window_days: 7
  repeat_violation_threshold: 2
  repeat_violation_extra_penalty: -1
  score_quality_content: 3
  score_pr_merged: 3
  score_quality_comment: 2
  score_tag_recognized: 1
  score_judge_accuracy: 1
  score_rehab_course: 1
  score_valid_report: 1
  score_malicious_content: -3
  score_malicious_pr: -3
  score_malicious_comment: -2
  score_malicious_report: -2
  score_malicious_tag_report: -1
  score_judge_error: -1

judge:
  min_votes_required: 20
  pass_threshold: 0.60
  exam_pass_rate: 0.80
  error_rate_revoke: 0.50
  error_rate_window: 10

ip_proposal:
  min_votes: 10
  pass_threshold: 0.60
  deadline_days: 7

discussion:
  hot_decay_hours: 72

social:
  report_auto_hide_rate: 0.10
  comment_fold_threshold: 0.30

collaboration:
  invite_daily_limit: 20
  invite_expire_days: 7
  max_invitees_per_publish: 5
  max_contributors_per_item: 10

browse_history:
  retention_days: 7
  cleanup_time: "03:00"

recommendation:
  enabled: true
  hot_decay_hours: 48
  personalization_weight: 0.6
  min_interaction_for_personalize: 10
  embedding_topk: 200
  trending_window_days: 7
  refresh_interval_h: 2

publish:
  type_order_original: ["image", "article", "video", "audio", "template", "sheet_music", "other"]
  type_order_fanwork: ["image", "article", "video", "audio", "mod", "prompt", "sheet_music", "other"]

upload:
  sheet_music_extensions:
    - ".mid"
    - ".midi"
    - ".xml"
    - ".mxl"
    - ".mscz"
    - ".mscx"
    - ".pdf"
  # Media set size bounds for newly published image/video content (media
  # experience #83). Exposed through /api/v1/config/public as non-sensitive
  # limits; the frontend must not duplicate these constants.
  image_gallery_min_items: 2
  image_gallery_max_items: 9
  video_gallery_min_items: 1
  video_gallery_max_items: 3
    
agent:
  web_agent_enabled: false
  # Canonical profile (docs/reference/agent-runtime-matrix.md): MiniMax-M3
  # chat through the minimax adapter (tool calls + <think> splitting), with
  # DashScope text-embedding-v4 through a separate openai_compat embedding
  # provider. The native "qwen" adapter is retired for agent use — DashScope
  # chat belongs behind openai_compat with the compatible-mode base.
  llm_provider: "minimax"
  llm_model: "MiniMax-M3"
  llm_api_base: "https://api.minimaxi.com"
  llm_api_key: ""                      # 留空，改用 env var AGENT_LLM_API_KEY 注入（config.go 已实现）
  # Embedding follows llm_provider when embedding_provider is empty. The
  # canonical split wiring routes embeddings to openai_compat (DashScope) and
  # requires its own AGENT_EMBEDDING_API_KEY — cross-vendor embedding never
  # borrows the chat credential (fail-closed, factory + preflight enforce).
  embedding_provider: "openai_compat"
  embedding_model: "text-embedding-v4"
  embedding_api_base: "https://dashscope.aliyuncs.com/compatible-mode"  # 不要带尾部 /v1
  embedding_api_key: ""                # 留空，env var AGENT_EMBEDDING_API_KEY 注入
  embedding_dimensions: 1536
  rate_limit_per_day: 50
  rate_limit_per_minute: 5
  max_tool_calls_per_turn: 8
  # Canonical candidate is 4096 (M-series thinking consumes the output
  # budget); raise only after the thinking/answer token measurement lands.
  max_output_tokens: 1200
  provider_timeout_sec: 60
  provider_max_retries: 2
  citation_max_count: 5
  upload_assist_max_file_mb: 10
  max_user_message_chars: 4000
  chat_max_context_messages: 10
  conversation_list_limit: 50
  conversation_page_size: 20
  chat_context_token_budget: 8000

rate_limit:
  enabled: true
  normal_per_minute: 100
  upload_per_hour: 200
  credential_per_minute: 5
  search_per_minute: 30
  agent_window_sec: 86400
  agent_minute_window_sec: 60
  max_json_body_bytes: 10485760
  max_query_chars: 120
  max_search_limit: 50
  max_search_page: 100

cache:
  content_list_ttl: 300
  content_detail_ttl: 300
  ip_list_ttl: 300
  ip_detail_ttl: 300
  view_count_flush_interval: 60
  user_status_ttl: 300
  publish_freeze_ttl: 604800

queue:
  enabled: true
  max_attempts: 3
  retry_backoff_sec:
    - 10
    - 60
    - 300
  dlq_ttl_hours: 168
  maxlen: 100000
  worker_review: 2
  worker_notification: 1
  worker_embedding: 1
  worker_count: 1

# Standalone worker process (cmd/worker). Consumed only by cmd/worker: the
# API server never starts asynchronous consumers (ADR 0005).
worker:
  enabled: true
  concurrency: 2
  service_name: "omnicraft-worker"

# Outbox relay loop tuning (issue #200). batch_size bounds how many due outbox
# events one relay run claims; poll_interval_sec bounds delivery latency. The
# relay runs only in the standalone worker process (ADR 0005), so these values
# are server-side only and never reach the client-facing config response.
relay:
  batch_size: 100
  poll_interval_sec: 1
